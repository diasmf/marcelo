name: Radar gallery production smoke test
on:
  push:
    paths:
      - 'radar-casas/test_gallery_ui.py'
      - 'radar-casas/index.html'
      - '.github/workflows/radar-gallery-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser test dependencies
        run: |
          python -m pip install 'requests==2.32.5' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: JavaScript syntax, photos and simplified carousel smoke
        run: python radar-casas/test_gallery_ui.py
