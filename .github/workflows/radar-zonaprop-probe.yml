name: Radar Zonaprop source diagnostics
on:
  push:
    paths:
      - 'radar-casas/zonaprop_probe.py'
      - '.github/workflows/radar-zonaprop-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Inspect first-party Zonaprop HTML without logging in or bypassing restrictions
        run: python radar-casas/zonaprop_probe.py
