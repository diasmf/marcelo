name: Radar - validar cinco fontes recuperadas
on:
  push:
    paths:
      - 'radar-casas/collector.py'
      - 'radar-casas/test_collector.py'
      - '.github/workflows/radar-five-sources-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 14 * * 2'
permissions:
  contents: read
concurrency:
  group: radar-five-sources-check
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        agency:
          - 'Carro Propiedades'
          - 'Enrique Cannone Propiedades'
          - 'Jakim Propiedades'
          - 'Pablo Saullo e Hijos'
          - 'RE/MAX Fly Liniers'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and collector
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: Check source discovery and parsing without the target filter
        env:
          AGENCY: ${{ matrix.agency }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit
          python radar-casas/collector.py --browser --source-name "$AGENCY" --max-per-source 12 --emit-json | tee audit/collector.jsonl
          python - <<'PY'
          import json
          lines=[json.loads(l) for l in open('audit/collector.jsonl', encoding='utf-8') if l.startswith('{')]
          agency=next((x for x in lines if x.get('agency') and 'source_status' in x),{})
          assert agency.get('candidates',0)>0, f"No property links found by the collector: {agency}"
          print(f"Verified {agency['candidates']} property links, independently of rental targeting.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-source-check-${{ strategy.job-index }}
          path: audit/
          retention-days: 30
