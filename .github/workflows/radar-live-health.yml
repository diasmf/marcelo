name: Radar - production API verification
on:
  push:
    paths:
      - 'tests/radar_live_health.py'
      - '.github/workflows/radar-live-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live Vercel API and inventory
        run: python tests/radar_live_health.py
