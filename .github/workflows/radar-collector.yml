name: Radar agency collector
on:
  push:
    paths:
      - 'radar-casas/collector.py'
      - 'radar-casas/test_collector.py'
      - '.github/workflows/radar-collector.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only inspect matching agency listings without writing'
        type: boolean
        default: true
  schedule:
    - cron: '37 10 * * *'
permissions:
  contents: read
concurrency:
  group: radar-caba-collector
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 5, 10, 15, 20, 25, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Unit tests
        run: python -m unittest discover -s radar-casas -p 'test_collector.py' -v
      - name: Inspect five sources without modifying data
        run: python radar-casas/collector.py --source-offset ${{ matrix.offset }} --source-limit 5 --max-per-source 15 --emit-json
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Unit tests (no network)
        run: python -m unittest discover -s radar-casas -p 'test_collector.py' -v
      - name: Collect public agency listings (writes only if credentials are configured)
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python radar-casas/collector.py
          elif [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            python radar-casas/collector.py --apply
          else
            echo 'Collector remains read-only: Radar Supabase GitHub secrets are not configured.'
            python radar-casas/collector.py
          fi
