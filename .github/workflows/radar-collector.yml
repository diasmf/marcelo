name: Radar agency collector
on:
  push:
    paths:
      - 'radar-casas/collector.py'
      - 'radar-casas/test_collector.py'
      - 'radar-casas/github_oidc_upload.py'
      - 'radar-casas/check_source_status.py'
      - '.github/workflows/radar-collector.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only inspect matching agency listings without writing'
        type: boolean
        default: true
  schedule:
    - cron: '37 10 * * *'
permissions:
  contents: read
concurrency:
  group: radar-caba-collector
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Unit tests
        run: python -m unittest discover -s radar-casas -p 'test_collector.py' -v
      - name: Inspect fifteen sources without modifying data
        run: python radar-casas/collector.py --source-offset ${{ matrix.offset }} --source-limit 15 --max-per-source 12 --emit-json
  oidc-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: Verify secure GitHub identity on Supabase
        run: python radar-casas/github_oidc_upload.py --probe
      - name: Try real ingestion from one verified agency without a stored secret
        run: |
          python radar-casas/collector.py --browser --source-name "Varcasia Propiedades" --max-per-source 14 --export-path /tmp/radar-oidc-smoke.json
          python radar-casas/github_oidc_upload.py --batch-path /tmp/radar-oidc-smoke.json
      - name: Verify availability endpoint and submit a small safe status-check batch
        run: |
          python radar-casas/github_oidc_upload.py --probe-availability
          python radar-casas/check_source_status.py --shard 0 --shards 5 --max-samples 12 --export-path /tmp/radar-status-smoke.json
          python radar-casas/github_oidc_upload.py --batch-path /tmp/radar-status-smoke.json
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and Chromium
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: Unit tests (no network)
        run: python -m unittest discover -s radar-casas -p 'test_collector.py' -v
      - name: Collect agency listings in this source shard (read-only on the runner)
        shell: bash
        run: |
          python radar-casas/collector.py --browser --source-offset ${{ matrix.offset }} --source-limit 15 --max-per-source 30 --export-path /tmp/radar-source-${{ matrix.offset }}.json
      - name: Securely sync to Supabase using GitHub's temporary OIDC identity
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          RADAR_SOURCE_OFFSET: ${{ matrix.offset }}
        run: python radar-casas/github_oidc_upload.py --batch-path /tmp/radar-source-${{ matrix.offset }}.json
      - name: Report manual dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry-run requested; nothing was written to Supabase."
  verify-status:
    if: github.event_name == 'schedule' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'requests==2.32.5'
      - name: Verify original source pages without changing the database
        run: python radar-casas/check_source_status.py --shard ${{ matrix.shard }} --shards 5 --export-path /tmp/radar-status-${{ matrix.shard }}.json
      - name: Store reliable checks; only mark unavailable after two different days
        run: python radar-casas/github_oidc_upload.py --batch-path /tmp/radar-status-${{ matrix.shard }}.json
