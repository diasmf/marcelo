name: Radar agency collector
on:
  push:
    paths:
      - 'radar-casas/collector.py'
      - 'radar-casas/test_collector.py'
      - '.github/workflows/radar-collector.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only inspect matching agency listings without writing'
        type: boolean
        default: true
  schedule:
    - cron: '37 10 * * *'
permissions:
  contents: read
concurrency:
  group: radar-caba-collector
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Unit tests
        run: python -m unittest discover -s radar-casas -p 'test_collector.py' -v
      - name: Inspect fifteen sources without modifying data
        run: python radar-casas/collector.py --source-offset ${{ matrix.offset }} --source-limit 15 --max-per-source 12 --emit-json
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 15, 30, 45, 60]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and Chromium
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: Unit tests (no network)
        run: python -m unittest discover -s radar-casas -p 'test_collector.py' -v
      - name: Collect public agency listings (writes only if credentials are configured)
        env:
          SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python radar-casas/collector.py --browser --source-offset ${{ matrix.offset }} --source-limit 15 --max-per-source 30
          elif [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            python radar-casas/collector.py --apply --browser --source-offset ${{ matrix.offset }} --source-limit 15 --max-per-source 30
          else
            echo '::warning::AUTO-UPDATE DISABLED: configure RADAR_SUPABASE_URL and RADAR_SUPABASE_SERVICE_ROLE_KEY secrets in GitHub Actions.'
            python radar-casas/collector.py --browser --source-offset ${{ matrix.offset }} --source-limit 15 --max-per-source 30
          fi
