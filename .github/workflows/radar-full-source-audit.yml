name: Radar - auditoria completa das imobiliarias
on:
  push:
    paths:
      - 'radar-casas/audit_all_sources.py'
      - 'radar-casas/audit_sources.json'
      - '.github/workflows/radar-full-source-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 1'
permissions:
  contents: read
concurrency:
  group: radar-full-source-audit
  cancel-in-progress: true
jobs:
  audit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: Audit assigned agencies independently, ignoring target filter
        shell: bash
        run: |
          mkdir -p audit
          python radar-casas/audit_all_sources.py --group ${{ matrix.group }} --groups 8 --workers 3 --max-details 3 --browser | tee audit/audit-group-${{ matrix.group }}.jsonl
      - name: Preserve per-source findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-source-audit-${{ matrix.group }}
          path: audit/
          retention-days: 30
