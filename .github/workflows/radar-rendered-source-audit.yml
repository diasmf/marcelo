name: Radar - segunda auditoria via navegador
on:
  push:
    paths:
      - 'radar-casas/audit_rendered_followup.py'
      - '.github/workflows/radar-rendered-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-rendered-source-audit
  cancel-in-progress: true
jobs:
  browser-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'playwright==1.65.0'
          python -m playwright install --with-deps chromium
      - name: Check unverified agency catalogues with full browser rendering
        shell: bash
        run: |
          mkdir -p audit
          python radar-casas/audit_rendered_followup.py --group ${{ matrix.group }} --groups 6 | tee audit/rendered-group-${{ matrix.group }}.jsonl
      - name: Preserve browser inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-rendered-audit-${{ matrix.group }}
          path: audit/
          retention-days: 30
